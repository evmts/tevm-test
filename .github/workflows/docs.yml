name: Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'packages/**'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'packages/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck docs
        run: pnpm --filter @tevm/test-docs typecheck

      - name: Build docs
        run: pnpm docs:build

  deploy:
    name: Deploy to Vercel
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'evmts/tevm-test'
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://test.tevm.sh
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # Forks and unconfigured clones have no Vercel credentials. Skip the deploy
      # with a visible warning instead of failing every push to main.
      - name: Check Vercel credentials
        id: vercel
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Docs deploy skipped::Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets to deploy test.tevm.sh."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.vercel.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.vercel.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The Vercel project's Root Directory must be set to `docs`, so all three
      # commands below run from there.
      - name: Pull Vercel environment
        if: steps.vercel.outputs.configured == 'true'
        working-directory: docs
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        if: steps.vercel.outputs.configured == 'true'
        working-directory: docs
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        if: steps.vercel.outputs.configured == 'true'
        working-directory: docs
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
